</head><body class="bg-surface-deep text-on-surface font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">


  
<!-- Form Column (7 Cols) -->
<div class="lg:col-span-7 rounded-3xl bg-surface-container p-8 sm:p-10 shadow-2xl">

<p class="font-body-md text-body-md text-text-muted mb-6">
  Can't find the movie or series you're looking for? Submit a request below.
</p>

          
<form
  class="flex flex-col gap-6"
  id="inquiryForm"
  action="https://formsubmit.co/rm.elevation.official@gmail.com"
  method="POST"
>
  <input type="hidden" name="_subject" value="New Movie/Series Request - Elevation Network">
  <input type="hidden" name="_template" value="table">

<div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-text-primary uppercase tracking-wider" for="fullName">Your Name <span class="text-error">*</span></label>
<input class="w-full px-4 py-3 rounded-xl bg-surface-container-lowest text-text-primary font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-accent-cyan-soft transition-all placeholder:text-text-muted/40" id="fullName" name="name" placeholder="Marcus Vance" required="" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-text-primary uppercase tracking-wider" for="emailAddr">Movie/Series Title <span class="text-error">*</span></label>
<input class="w-full px-4 py-3 rounded-xl bg-surface-container-lowest text-text-primary font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-accent-cyan-soft transition-all placeholder:text-text-muted/40" id="emailAddr" name="title" placeholder="Enter the title of the movie or series you're requesting" required="" type="text"/>
</div>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-text-primary uppercase tracking-wider" for="companyName">Release Year</label>
<input class="w-full px-4 py-3 rounded-xl bg-surface-container-lowest text-text-primary font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-accent-cyan-soft transition-all placeholder:text-text-muted/40" id="companyName" name="year" placeholder="2023" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-text-primary uppercase tracking-wider" for="serviceSelect">Media Type</label>
<select class="w-full px-4 py-3 rounded-xl bg-surface-container-lowest text-text-primary font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-accent-cyan-soft transition-all" id="serviceSelect" name="media_type">
<option value="movie">Movie</option>
<option value="series">Series</option>

</select>
</div>
</div>

<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-text-primary uppercase tracking-wider" for="projectScope">Additional Details <span class="text-error">*</span></label>
<textarea class="w-full px-4 py-3 rounded-xl bg-surface-container-lowest text-text-primary font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-accent-cyan-soft transition-all placeholder:text-text-muted/40" id="projectScope" name="message" placeholder="" required="" rows="4"></textarea>
</div>
<button class="w-full py-4 rounded-xl bg-primary-container text-on-primary-container font-label-md text-label-md flex items-center justify-center gap-2 shadow-[0_0_24px_rgba(0,102,255,0.4)] hover:shadow-[0_0_32px_rgba(0,240,255,0.5)] hover:brightness-110 transition-all cursor-pointer" id="submitBtn" type="submit">
<span>Send</span>
<span class="material-symbols-outlined text-[18px]">send</span>
</button>
<div class="hidden p-4 rounded-xl bg-secondary-container/20 text-secondary-fixed text-center font-label-md text-label-md" id="formSuccess">
              Thank you!
            </div>
</form>
</div>
</section>



<script>
    document.addEventListener('DOMContentLoaded', () => {
      // Filter functionality
      const filterButtons = document.querySelectorAll('#filter-container button');
      const projectCards = document.querySelectorAll('.project-card');

      filterButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          filterButtons.forEach(b => {
            b.classList.remove('bg-primary-container', 'text-on-primary-container');
            b.classList.add('bg-surface-container', 'text-on-surface-variant');
          });
          btn.classList.remove('bg-surface-container', 'text-on-surface-variant');
          btn.classList.add('bg-primary-container', 'text-on-primary-container');

          const filter = btn.getAttribute('data-filter');
          projectCards.forEach(card => {
            if (filter === 'all') {
              card.style.display = 'flex';
            } else {
              const categories = card.getAttribute('data-category') || '';
              if (categories.includes(filter)) {
                card.style.display = 'flex';
              } else {
                card.style.display = 'none';
              }
            }
          });
        });
      });

      // FormSubmit: allow the form to submit normally
const form = document.getElementById('inquiryForm');
const submitBtn = document.getElementById('submitBtn');

if (form && submitBtn) {
  form.addEventListener('submit', function () {
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span>Sending Request...</span>';
  });
}
    });
  </script>

  <a class="font-body-md text-body-md text-on-surface-variant hover:text-secondary-fixed-dim transition-colors" data-path="web-design" href="#">Android Stick</a>

</div>


<a class="font-body-md text-body-md text-primary hover:text-secondary-fixed-dim transition-colors" href="mailto:inquiry@elevation-network.net">rm.elevation.official@gmail.com</a></div></div><div class="pt-space-md flex flex-col sm:flex-row items-center justify-between gap-space-sm text-text-muted font-body-sm text-body-sm"><p>© 2026 Elevation Network. All rights reserved.</p><div class="flex items-center gap-space-md"></div></div></div></footer></body></html>
